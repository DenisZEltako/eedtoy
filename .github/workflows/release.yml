name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix, for example 1.0.94"
        required: true
        type: string
      replace_existing:
        description: "Replace an existing release asset for this version"
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      RELEASE_TAG: v${{ inputs.version }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version prüfen
        shell: python
        run: |
          from pathlib import Path
          import json
          import re
          import os

          version = os.environ["VERSION"].strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"Invalid version: {version}")

          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          lock = json.loads(Path("package-lock.json").read_text(encoding="utf-8"))
          app = Path("src/App.jsx").read_text(encoding="utf-8")
          tests = Path("tests/yaml_generation_regression.js").read_text(encoding="utf-8")

          assert package["version"] == version, f"package.json is {package['version']}, expected {version}"
          assert lock["version"] == version, f"package-lock.json is {lock['version']}, expected {version}"
          assert lock["packages"][""]["version"] == version
          assert f'const APP_VERSION = "{version}";' in app
          assert f"Application version is {version}" in tests
          assert f"# Version: {version}" in tests

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build-Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Node-Abhängigkeiten installieren
        run: npm ci

      - name: Eingebettete Python-Laufzeit bauen
        shell: pwsh
        run: ./build/prepare_embedded_python.ps1 -PythonVersion "3.12.10" -BuildPython "python"

      - name: Anwendung und Runtime prüfen
        shell: pwsh
        run: |
          $python = Join-Path $PWD "python-runtime\python.exe"
          if (!(Test-Path $python)) { throw "Embedded python.exe fehlt." }
          & $python -I -c "import serial, serial_asyncio, aiocoap, yaml, eltakobus; from eltakobus.serial import RS485SerialInterfaceV2; print('embedded runtime OK')"
          if ($LASTEXITCODE -ne 0) { throw "Embedded runtime validation failed." }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Application tests failed." }

      - name: Windows-Installer bauen
        run: npm run build:installer

      - name: Installierten Build validieren
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist-exe -Filter "*.exe" -File |
            Where-Object { $_.Name -match [regex]::Escape($env:VERSION) } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $installer) { throw "Kein Installer für Version $env:VERSION gefunden." }

          $installDir = Join-Path $env:RUNNER_TEMP "EEDTOY-release-test"
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installation failed with exit code $($process.ExitCode)." }

          $installedPython = Join-Path $installDir "resources\python-runtime\python.exe"
          $installedApp = Join-Path $installDir "EEDTOY.exe"
          if (!(Test-Path $installedApp)) { throw "Installed EEDTOY.exe fehlt." }
          if (!(Test-Path $installedPython)) { throw "Installed embedded python.exe fehlt." }
          & $installedPython -I -c "import serial, serial_asyncio, aiocoap, yaml, eltakobus; from eltakobus.serial import RS485SerialInterfaceV2; print('installed runtime OK')"
          if ($LASTEXITCODE -ne 0) { throw "Installed runtime validation failed." }

          "INSTALLER_PATH=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLER_NAME=$($installer.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Installer als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: EEDTOY-v${{ inputs.version }}-Windows-Installer
          path: ${{ env.INSTALLER_PATH }}
          if-no-files-found: error

      - name: Release veröffentlichen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE_EXISTING: ${{ inputs.replace_existing }}
        run: |
          $releaseExists = $false
          gh release view $env:RELEASE_TAG --repo $env:GH_REPO *> $null

          if ($LASTEXITCODE -eq 0) {
            $releaseExists = $true
          }

          if ($releaseExists -and $env:REPLACE_EXISTING -ne "true") {
            throw "Release $env:RELEASE_TAG already exists. Enable replace_existing to replace its asset."
          }

          if (-not $releaseExists) {
            $tagExists = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"

            if (-not $tagExists) {
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

              git tag -a $env:RELEASE_TAG -m "EEDTOY $env:RELEASE_TAG"

              if ($LASTEXITCODE -ne 0) {
                throw "Tag $env:RELEASE_TAG konnte nicht erstellt werden."
              }

              git push origin $env:RELEASE_TAG

              if ($LASTEXITCODE -ne 0) {
                throw "Tag $env:RELEASE_TAG konnte nicht hochgeladen werden."
              }
            }

            gh release create `
              $env:RELEASE_TAG `
              $env:INSTALLER_PATH `
              --repo $env:GH_REPO `
              --verify-tag `
              --title "EEDTOY $env:RELEASE_TAG" `
              --generate-notes `
              --latest

            if ($LASTEXITCODE -ne 0) {
              throw "Release $env:RELEASE_TAG konnte nicht erstellt werden."
            }
          }
          else {
            gh release upload `
              $env:RELEASE_TAG `
              $env:INSTALLER_PATH `
              --repo $env:GH_REPO `
              --clobber

            if ($LASTEXITCODE -ne 0) {
              throw "Installer konnte nicht ersetzt werden."
            }

            gh release edit `
              $env:RELEASE_TAG `
              --repo $env:GH_REPO `
              --title "EEDTOY $env:RELEASE_TAG" `
              --latest
          }
