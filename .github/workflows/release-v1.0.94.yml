name: Release EEDTOY v1.0.94

on:
  push:
    paths:
      - .github/workflows/release-v1.0.94.yml

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v1.0.94
      RELEASE_TITLE: EEDTOY v1.0.94

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python-Abhängigkeiten prüfen
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r python/requirements.txt
          python -c "import serial, serial_asyncio, aiocoap, yaml, eltakobus; from eltakobus.serial import RS485SerialInterfaceV2; print('EEDTOY Python runtime OK')"

      - name: Node-Abhängigkeiten installieren
        run: npm ci

      - name: Tests ausführen
        run: npm test

      - name: Windows-Installer bauen
        run: npm run build:installer

      - name: Installer prüfen
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist-exe -Filter "*.exe" -File |
            Where-Object { $_.Name -match "1\.0\.94" } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $installer) {
            throw "Kein EEDTOY-v1.0.94-Installer in dist-exe gefunden."
          }

          "INSTALLER_PATH=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLER_NAME=$($installer.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Release-Installer: $($installer.FullName)"

      - name: Build-Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: EEDTOY-v1.0.94-Windows-Installer
          path: ${{ env.INSTALLER_PATH }}
          if-no-files-found: error

      - name: Release-Text erstellen
        shell: pwsh
        run: |
          @"
          ## EEDTOY v1.0.94

          ### Python-Laufzeit und Gateway-Erkennung

          - Vollständige automatische Installation der benötigten Python-Pakete
          - Private EEDTOY-Python-Umgebung unter `%APPDATA%\EEDTOY\python-runtime`
          - Unterstützung für `eltako14bus`, `pyserial`, `pyserial-asyncio`, `aiocoap` und `PyYAML`
          - Vollständige Modulprüfung vor der Gateway-Erkennung
          - Kein ungeprüfter Rückfall mehr auf eine globale Python-Installation
          - Sichtbare Python-Einrichtung während der Windows-Installation
          - Der Installer bricht verständlich ab, wenn die Laufzeit nicht vollständig eingerichtet werden kann

          ### COM-Port-Auswahl

          - Echtes Dropdown für mehrere erkannte COM-Ports
          - Alle angeschlossenen seriellen Gateways werden einzeln angezeigt
          - Bereits ausgewählter COM-Port bleibt bei einer erneuten Suche erhalten
          - Manuelle COM-Port-Eingabe bleibt verfügbar

          ### Stabilität

          - Versionsangaben in Anwendung, YAML-Header, `package.json` und Tests vereinheitlicht
          - Regressionstests und Windows-Build vor dem Release geprüft

          ### Installation

          Die Datei **$env:INSTALLER_NAME** herunterladen und ausführen. Für die erstmalige Einrichtung der Python-Laufzeit ist eine Internetverbindung erforderlich.
          "@ | Set-Content -Path release-notes-v1.0.94.md -Encoding utf8

      - name: Tag und GitHub-Release erstellen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $tagExists = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if (-not $tagExists) {
            git tag -a $env:RELEASE_TAG -m $env:RELEASE_TITLE
            git push origin $env:RELEASE_TAG
          }

          gh release view $env:RELEASE_TAG --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $env:INSTALLER_PATH --repo $env:GH_REPO --clobber
            gh release edit $env:RELEASE_TAG --repo $env:GH_REPO --title $env:RELEASE_TITLE --notes-file release-notes-v1.0.94.md --latest
          } else {
            gh release create $env:RELEASE_TAG $env:INSTALLER_PATH --repo $env:GH_REPO --verify-tag --title $env:RELEASE_TITLE --notes-file release-notes-v1.0.94.md --latest
          }
