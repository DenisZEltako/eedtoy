name: Release EEDTOY v1.0.95

on:
  push:
    paths:
      - .github/workflows/release-v1.0.95.yml

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v1.0.95
      RELEASE_TITLE: EEDTOY v1.0.95

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version und Python-Pruefung korrigieren
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package["version"] = "1.0.95"
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          lock_path = Path("package-lock.json")
          lock = json.loads(lock_path.read_text(encoding="utf-8"))
          lock["version"] = "1.0.95"
          lock["packages"][""]["version"] = "1.0.95"
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          app_path = Path("src/App.jsx")
          app = app_path.read_text(encoding="utf-8")
          app = re.sub(r'const APP_VERSION = "[^"]+";', 'const APP_VERSION = "1.0.95";', app, count=1)
          app_path.write_text(app, encoding="utf-8")

          test_path = Path("tests/yaml_generation_regression.js")
          test = test_path.read_text(encoding="utf-8")
          test = test.replace("1.0.94", "1.0.95")
          test = test.replace("1.0.93", "1.0.95")
          test_path.write_text(test, encoding="utf-8")

          bootstrap_path = Path("python/bootstrap_runtime_windows.ps1")
          bootstrap = bootstrap_path.read_text(encoding="utf-8-sig")
          bootstrap = re.sub(
              r'import serial, serial_asyncio(?:, aiocoap)?, yaml, eltakobus;',
              'import serial, serial_asyncio, aiocoap, yaml, eltakobus;',
              bootstrap,
          )
          bootstrap_path.write_text(bootstrap, encoding="utf-8")

          main_path = Path("electron/main.js")
          main = main_path.read_text(encoding="utf-8")
          main = re.sub(
              r'import serial, serial_asyncio(?:, aiocoap)?, yaml, eltakobus',
              'import serial, serial_asyncio, aiocoap, yaml, eltakobus',
              main,
          )
          main_path.write_text(main, encoding="utf-8")

      - name: Korrekturen kontrollieren
        shell: python
        run: |
          from pathlib import Path
          import json

          requirements = Path("python/requirements.txt").read_text(encoding="utf-8")
          assert "eltako14bus[serial]==0.0.82" in requirements
          assert "eltako14bus[coap" not in requirements.lower()
          assert "aiocoap>=0.4.17" in requirements

          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          lock = json.loads(Path("package-lock.json").read_text(encoding="utf-8"))
          assert package["version"] == "1.0.95"
          assert lock["version"] == "1.0.95"
          assert lock["packages"][""]["version"] == "1.0.95"

          app = Path("src/App.jsx").read_text(encoding="utf-8")
          test = Path("tests/yaml_generation_regression.js").read_text(encoding="utf-8")
          bootstrap = Path("python/bootstrap_runtime_windows.ps1").read_text(encoding="utf-8")
          main = Path("electron/main.js").read_text(encoding="utf-8")

          assert 'const APP_VERSION = "1.0.95";' in app
          assert "Application version is 1.0.95" in test
          assert "# Version: 1.0.95" in test
          assert "import serial, serial_asyncio, aiocoap, yaml, eltakobus" in bootstrap
          assert "import serial, serial_asyncio, aiocoap, yaml, eltakobus" in main
          assert "RS485SerialInterfaceV2" in bootstrap

      - name: Korrekturen committen
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/App.jsx tests/yaml_generation_regression.js python/bootstrap_runtime_windows.ps1 electron/main.js python/requirements.txt
          if (-not (git diff --cached --quiet)) {
            git commit -m "Release EEDTOY v1.0.95 with compatible aiocoap runtime"
            git push
          }

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python-Abhaengigkeiten pruefen
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r python/requirements.txt
          python -c "import serial, serial_asyncio, aiocoap, yaml, eltakobus; from eltakobus.serial import RS485SerialInterfaceV2; print('EEDTOY Python runtime OK')"

      - name: Node-Abhaengigkeiten installieren
        run: npm ci

      - name: Tests ausfuehren
        run: npm test

      - name: Windows-Installer bauen
        run: npm run build:installer

      - name: Installer pruefen
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist-exe -Filter "*.exe" -File |
            Where-Object { $_.Name -match "1\.0\.95" } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $installer) {
            throw "Kein EEDTOY-v1.0.95-Installer gefunden."
          }

          "INSTALLER_PATH=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLER_NAME=$($installer.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Installer als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: EEDTOY-v1.0.95-Windows-Installer
          path: ${{ env.INSTALLER_PATH }}
          if-no-files-found: error

      - name: Release-Text erstellen
        shell: pwsh
        run: |
          @"
          ## EEDTOY v1.0.95

          ### Kritische Korrektur

          - Das veraltete CoAP-Extra von `eltako14bus` wird nicht mehr aktiviert
          - `aiocoap` wird separat in einer aktuellen, Python-3.12-kompatiblen Version installiert
          - Vollständige Prüfung von `pyserial`, `pyserial-asyncio`, `aiocoap`, `PyYAML` und `eltako14bus`
          - Serielle Gateway-Erkennung mit `RS485SerialInterfaceV2` wird vor dem Release geprüft

          ### Installation

          Die Datei **$env:INSTALLER_NAME** herunterladen und ausführen. Die fehlerhaften Installer v1.0.94 und der erste fehlgeschlagene v1.0.95-Build sollten nicht verwendet werden.
          "@ | Set-Content -Path release-notes-v1.0.95.md -Encoding utf8

      - name: Tag und Release erstellen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only

          $tagExists = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if (-not $tagExists) {
            git tag -a $env:RELEASE_TAG -m $env:RELEASE_TITLE
            git push origin $env:RELEASE_TAG
          }

          gh release view $env:RELEASE_TAG --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $env:INSTALLER_PATH --repo $env:GH_REPO --clobber
            gh release edit $env:RELEASE_TAG --repo $env:GH_REPO --title $env:RELEASE_TITLE --notes-file release-notes-v1.0.95.md --latest
          } else {
            gh release create $env:RELEASE_TAG $env:INSTALLER_PATH --repo $env:GH_REPO --verify-tag --title $env:RELEASE_TITLE --notes-file release-notes-v1.0.95.md --latest
          }
