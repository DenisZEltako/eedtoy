name: Finalize EEDTOY v1.0.94 Python runtime

on:
  push:
    paths:
      - .github/workflows/finalize-v1.0.94-python-runtime.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Complete runtime validation
        shell: python
        run: |
          from pathlib import Path

          path = Path("electron/main.js")
          text = path.read_text(encoding="utf-8")
          old = 'const code = \'import serial, serial_asyncio, yaml, eltakobus; print("ok")\';'
          new = 'const code = \'import serial, serial_asyncio, aiocoap, yaml, eltakobus; from eltakobus.serial import RS485SerialInterfaceV2; print("ok")\';'
          if old not in text:
              raise SystemExit("Runtime validation marker not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Validate source
        shell: python
        run: |
          from pathlib import Path
          text = Path("electron/main.js").read_text(encoding="utf-8")
          assert "import serial, serial_asyncio, aiocoap, yaml, eltakobus" in text
          assert "from eltakobus.serial import RS485SerialInterfaceV2" in text

      - name: Install Node dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/main.js
          git commit -m "Complete v1.0.94 Python runtime validation"
          git push
