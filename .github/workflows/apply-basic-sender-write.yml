name: Apply basic sender-write update

on:
  push:
    branches:
      - agent/basic-sender-write-1.0.95
    paths:
      - tools/apply_basic_sender_write_1_0_95.py
      - .github/workflows/apply-basic-sender-write.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: agent/basic-sender-write-1.0.95
          fetch-depth: 0

      - name: Python-Migration ausführen
        run: python tools/apply_basic_sender_write_1_0_95.py

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests ausführen
        run: npm test

      - name: Migration entfernen und Änderungen committen
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply_basic_sender_write_1_0_95.py
          rm -f .github/workflows/apply-basic-sender-write.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add one-click sender programming" || exit 0
          git push origin agent/basic-sender-write-1.0.95
