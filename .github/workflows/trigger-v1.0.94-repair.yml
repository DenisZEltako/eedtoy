name: Trigger EEDTOY v1.0.94 repair

on:
  push:
    paths:
      - .github/workflows/trigger-v1.0.94-repair.yml

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reparatur-Workflow neu ausloesen
        run: |
          printf '\n# retrigger after platform-independent database hash fix\n' >> .github/workflows/release-v1.0.95.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release-v1.0.95.yml
          git commit -m "Retrigger EEDTOY v1.0.94 repair"
          git push
