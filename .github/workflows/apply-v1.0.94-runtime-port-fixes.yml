name: Apply EEDTOY v1.0.94 fixes

on:
  push:
    paths:
      - .github/workflows/apply-v1.0.94-runtime-port-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: EEDTOY-Code aktualisieren
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package["version"] = "1.0.94"
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          lock_path = Path("package-lock.json")
          lock = json.loads(lock_path.read_text(encoding="utf-8"))
          lock["version"] = "1.0.94"
          lock["packages"][""]["version"] = "1.0.94"
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          app_path = Path("src/App.jsx")
          app = app_path.read_text(encoding="utf-8")
          app = re.sub(r'const APP_VERSION = "[^"]+";', 'const APP_VERSION = "1.0.94";', app, count=1)

          old_scan = 'setGateway(g => ({ ...g, serial_path: found[0].path }));'
          new_scan = 'setGateway(g => ({ ...g, serial_path: found.some(p => p.path === g.serial_path) ? g.serial_path : found[0].path }));'
          if old_scan not in app:
              raise SystemExit("handleScanPorts assignment not found")
          app = app.replace(old_scan, new_scan, 1)

          port_pattern = re.compile(
              r'''\s*<input\n\s*value=\{gateway\.serial_path\}.*?</datalist>''',
              re.S,
          )
          port_replacement = r'''
                        <div style={{display:"flex",flexDirection:"column",gap:".35rem",flex:1}}>
                          <select
                            value={ports.some(p=>p.path===gateway.serial_path) ? gateway.serial_path : "__manual__"}
                            onChange={e=>{
                              const value = e.target.value;
                              setGateway(g=>({...g,serial_path:value==="__manual__"?"":value}));
                            }}
                          >
                            <option value="__manual__">{language==="en"?"Enter COM port manually":"COM-Port manuell eingeben"}</option>
                            {ports.map(p=>(
                              <option key={p.path} value={p.path}>
                                {p.manufacturer?`${p.path} — ${p.manufacturer}`:p.path}
                              </option>
                            ))}
                          </select>
                          {!ports.some(p=>p.path===gateway.serial_path)&&(
                            <input
                              value={gateway.serial_path}
                              onChange={e=>setGateway(g=>({...g,serial_path:e.target.value}))}
                              placeholder={t("gateway.serialPortPlaceholder")}
                            />
                          )}
                        </div>'''
          app, count = port_pattern.subn(port_replacement, app, count=1)
          if count != 1:
              raise SystemExit(f"COM port input/datalist block replacement count: {count}")
          app_path.write_text(app, encoding="utf-8")

          test_path = Path("tests/yaml_generation_regression.js")
          test = test_path.read_text(encoding="utf-8")
          old_test = "assert(api.APP_VERSION === '1.0.93', 'Application version is 1.0.93');"
          new_test = "assert(api.APP_VERSION === '1.0.94', 'Application version is 1.0.94');"
          if old_test not in test:
              raise SystemExit("Version assertion in YAML regression test not found")
          test_path.write_text(test.replace(old_test, new_test, 1), encoding="utf-8")

          main_path = Path("electron/main.js")
          main = main_path.read_text(encoding="utf-8")
          main = main.replace(
              "const code = 'import serial, yaml, eltakobus; print(\"ok\")';",
              "const code = 'import serial, serial_asyncio, yaml, eltakobus; print(\"ok\")';",
              1,
          )
          main = main.replace(
              "['-m', 'pip', 'install', '-r', requirements]",
              "['-m', 'pip', 'install', '--upgrade', '-r', requirements]",
              1,
          )

          commands_pattern = re.compile(
              r'''async function getPythonCommands\(script\) \{.*?\n\}\n\n// ─+\n// PYTHON BRIDGE:''',
              re.S,
          )
          commands_replacement = '''async function getPythonCommands(script) {
            const setup = await ensurePythonRuntime();
            if (setup.ok) return { ok: true, commands: [{ cmd: setup.pythonPath, args: [script] }], setup };

            // Never execute the detector with an unverified global Python.
            // Otherwise users receive misleading ModuleNotFoundError messages.
            return { ok: false, commands: [], setup };
          }

          // ─────────────────────────────────────────────────────────────────
          // PYTHON BRIDGE:'''
          main, count = commands_pattern.subn(commands_replacement, main, count=1)
          if count != 1:
              raise SystemExit(f"getPythonCommands replacement count: {count}")
          main_path.write_text(main, encoding="utf-8")

      - name: Änderungen kontrollieren
        shell: python
        run: |
          from pathlib import Path
          import json

          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          assert package["version"] == "1.0.94"

          lock = json.loads(Path("package-lock.json").read_text(encoding="utf-8"))
          assert lock["version"] == "1.0.94"
          assert lock["packages"][""]["version"] == "1.0.94"

          app = Path("src/App.jsx").read_text(encoding="utf-8")
          assert 'const APP_VERSION = "1.0.94";' in app
          assert 'value="__manual__"' in app
          assert '<datalist id="serial-port-list">' not in app

          test = Path("tests/yaml_generation_regression.js").read_text(encoding="utf-8")
          assert "Application version is 1.0.94" in test

          main = Path("electron/main.js").read_text(encoding="utf-8")
          assert "import serial, serial_asyncio, yaml, eltakobus" in main
          assert "Never execute the detector with an unverified global Python" in main

      - name: Node-Abhängigkeiten installieren
        run: npm ci

      - name: Tests ausführen
        run: npm test

      - name: Frontend bauen
        run: npm run build

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/App.jsx electron/main.js tests/yaml_generation_regression.js
          git commit -m "Prepare EEDTOY v1.0.94 runtime and COM port fixes"
          git push
