name: Apply FHK Multi-Sender Fix

on:
  push:
    branches:
      - agent/basic-sender-write-1.0.95
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/basic-sender-write-1.0.95
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply FHK multi-sender fix
        run: python tools/apply_fhk_multi_sender_fix.py

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Remove migration files and commit fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-fhk-multiple-controller-senders.yml
          rm -f tools/apply_fhk_multi_sender_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python/write_senders.py tests/test_write_senders_patch.py .github/workflows/fix-fhk-multiple-controller-senders.yml tools/apply_fhk_multi_sender_fix.py
          git commit -m "Allow multiple controller senders in FHK devices"
          git push origin HEAD:agent/basic-sender-write-1.0.95
