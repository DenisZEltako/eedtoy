name: Apply FHK Multi-Sender Fix

on:
  push:
    branches:
      - agent/basic-sender-write-1.0.95
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/basic-sender-write-1.0.95
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Allow multiple FHK controller senders
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('python/write_senders.py')
          text = path.read_text(encoding='utf-8')
          old = '''async def _ensure_programmed_fhk_controller(
              dev: Any,
              sender_id: str,
              channel: int,
              device_type: str,
          ) -> Optional[bool]:
              """Program the fixed smart-home-controller line used by FHK14/F4HK14/FAE14SSR."""
              sender = _sender_bytes_from_id(sender_id)
              upper_type = str(device_type or "").upper()
              start_line = 16 if "F4HK14" in upper_type else 12
              memory_line = start_line + int(channel or 0)
              memory_size = int(getattr(dev, "memory_size", 0) or 0)
              if memory_line >= memory_size or not hasattr(dev, "read_mem_line") or not hasattr(dev, "write_mem_line"):
                  return None

              expected_line = sender + bytes((0, 65, 1 << int(channel or 0), 0))
              current_line = await dev.read_mem_line(memory_line)
              if current_line == expected_line:
                  return False
              if any(current_line):
                  current_sender = norm_id("-".join(f"{b:02X}" for b in current_line[:4]))
                  raise RuntimeError(
                      f"FHK-Controller-Speicherzeile {memory_line} ist bereits mit Sender {current_sender} belegt"
                  )
              await dev.write_mem_line(memory_line, expected_line)
              return True
'''
          new = '''async def _ensure_programmed_fhk_controller(
              dev: Any,
              sender_id: str,
              channel: int,
              device_type: str,
          ) -> Optional[bool]:
              """Program one or more smart-home-controller senders for FHK14/F4HK14/FAE14SSR."""
              sender = _sender_bytes_from_id(sender_id)
              upper_type = str(device_type or "").upper()
              start_line = 16 if "F4HK14" in upper_type else 12
              memory_size = int(getattr(dev, "memory_size", 0) or 0)
              if memory_size <= start_line or not hasattr(dev, "read_mem_line") or not hasattr(dev, "write_mem_line"):
                  return None

              expected_line = sender + bytes((0, 65, 1 << int(channel or 0), 0))

              # FHK devices can contain more than one controller sender for the same
              # channel, e.g. the internal 00-00-B0-xx sender plus a FAM-USB sender.
              # Therefore never treat the channel's first controller line as exclusive.
              first_empty = None
              for memory_line in range(start_line, memory_size):
                  current_line = await dev.read_mem_line(memory_line)
                  if current_line == expected_line:
                      return False
                  if not any(current_line) and first_empty is None:
                      first_empty = memory_line

              if first_empty is None:
                  raise RuntimeError("Kein freier FHK-Controller-Speicherplatz für einen weiteren Sender gefunden")

              await dev.write_mem_line(first_empty, expected_line)
              return True
'''
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f'FHK function replacement: expected 1 match, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_write_senders_patch.py')
          test = test_path.read_text(encoding='utf-8')
          anchor = '''async def test_memory_layouts():
'''
          if test.count(anchor) != 1:
              raise RuntimeError(f'test anchor: expected 1 match, found {test.count(anchor)}')
          addition = '''async def test_fhk_multiple_controller_senders():
    dev = FakeDevice(memory_size=24)
    first = module._sender_bytes_from_id("00-00-B0-01") + bytes((0, 65, 1, 0))
    second = module._sender_bytes_from_id("FF-A6-07-01") + bytes((0, 65, 1, 0))
    dev.memory[12] = first

    assert await module._ensure_programmed_fhk_controller(dev, "00-00-B0-01", 0, "FHK14") is False
    assert await module._ensure_programmed_fhk_controller(dev, "FF-A6-07-01", 0, "FHK14") is True
    assert dev.memory[13] == second
    assert await module._ensure_programmed_fhk_controller(dev, "FF-A6-07-01", 0, "FHK14") is False


'''
          test = test.replace(anchor, addition + anchor, 1)
          call_anchor = '''    asyncio.run(test_memory_layouts())
'''
          if test.count(call_anchor) != 1:
              raise RuntimeError(f'test call anchor: expected 1 match, found {test.count(call_anchor)}')
          test = test.replace(call_anchor, '''    asyncio.run(test_fhk_multiple_controller_senders())
''' + call_anchor, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Remove one-time workflow and commit fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-fhk-multiple-controller-senders.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python/write_senders.py tests/test_write_senders_patch.py .github/workflows/fix-fhk-multiple-controller-senders.yml
          git commit -m "Allow multiple controller senders in FHK devices"
          git push origin HEAD:agent/basic-sender-write-1.0.95
